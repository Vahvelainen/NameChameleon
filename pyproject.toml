[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "namechameleon"
version = "0.1.0"
readme = "README.md"
dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "Faker>=20.0.0",
]

[project.scripts]
chameleon = "namechameleon.cli.cli:main"

[tool.setuptools.packages.find]
include = ["namechameleon*"]

